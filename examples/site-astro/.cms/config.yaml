# yaml-language-server: $schema=../../../packages/spec/json-schema/config.schema.json

version: 1

content:
  regions: content/cms
  media: public/media

mediaUrlPrefix: /media

publish:
  branch: main
  draftBranchPrefix: cms/draft
  commitMessage: "content: update {summary}"

preview:
  # {branch} is substituted, so a draft save gives you a link to your own CI's
  # preview build — the real site, not an approximation of it.
  urlTemplate: "https://{branch}--greatcms-example.pages.dev"
