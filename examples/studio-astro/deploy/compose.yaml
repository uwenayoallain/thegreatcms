# A whole GreatCMS site on one server: the studio editors use, the builder that turns each
# publish into a new release, and Caddy serving the result with HTTPS.
# Builds the two GreatCMS images from this repository.
#
#   cp .env.example .env     # then fill it in
#   COMPOSE_BAKE=false docker compose up -d --build
#
# After a reboot, or after stopping everything by hand, `docker compose up -d` brings it all back.
#
# One DOMAIN in .env gives four addresses, all pointed at this server:
#   DOMAIN            the site (redirects to www)
#   www.DOMAIN        the site
#   studio.DOMAIN     where editors sign in and publish
#   preview.DOMAIN    the site's dev server, open only to a browser signed in to the studio
#
# The site is cloned once into ${SITES_DIR}/paraline (default /srv/sites/paraline) on the host.

name: paraline

x-hosts: &hosts
  SCHEME: ${SCHEME:-https}
  SITE_HOST: ${DOMAIN:?set DOMAIN in .env}
  WWW_HOST: www.${DOMAIN}
  STUDIO_HOST: studio.${DOMAIN}
  PREVIEW_HOST: preview.${DOMAIN}

# Every container: no writes outside its volumes, no capabilities, no way to gain any, a bounded
# log, and an init that reaps what its children leave behind.
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  caddy:
    <<: *hardened
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    # The one capability it keeps: ports 80 and 443.
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443"]
    environment: *hosts
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - www:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks: [edge, sites]
    mem_limit: 256m
    pids_limit: 256
    depends_on: [studio, deploy]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 5s

  studio:
    <<: *hardened
    build:
      context: ../../..
      dockerfile: apps/studio/Dockerfile
      network: host
    environment:
      STUDIO_PASSWORD: "${STUDIO_PASSWORD:?set STUDIO_PASSWORD in .env}"
      STUDIO_SECRET: "${STUDIO_SECRET:?set STUDIO_SECRET in .env}"
      # Only caddy shares a network with the studio, so the visitor address it is told can be trusted.
      STUDIO_TRUST_PROXY: "1"
      # Where browsers reach the studio, and the domain its sign-in is shared across, so the
      # preview can ask it whether a visitor is signed in.
      STUDIO_URL: ${SCHEME:-https}://studio.${DOMAIN}
      STUDIO_COOKIE_DOMAIN: ${DOMAIN}
      # The site is registered on first start under a fixed id, which is also its form address.
      STUDIO_SITES: >-
        [{"id":"paraline","name":"Paraline","path":"/srv/sites/paraline/examples/studio-astro","deployRoot":"/srv/www",
          "devUrl":"${SCHEME:-https}://preview.${DOMAIN}","pushAfterPublish":${PUSH_AFTER_PUBLISH:-false}}]
      GIT_AUTHOR_NAME: ${GIT_NAME:-Studio}
      GIT_AUTHOR_EMAIL: ${GIT_EMAIL:-studio@example.com}
      GIT_COMMITTER_NAME: ${GIT_NAME:-Studio}
      GIT_COMMITTER_EMAIL: ${GIT_EMAIL:-studio@example.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
    volumes:
      - ${SITES_DIR:-/srv/sites}:/srv/sites
      - studio-data:/data
      # What is live, and where a rollback is asked for.
      - www:/srv/www
      # Only needed when pushing to GitHub: a deploy key with write access.
      - ${SSH_DIR:-./ssh}:/home/node/.ssh:ro
    tmpfs:
      - /tmp
    networks: [edge]
    mem_limit: ${STUDIO_MEMORY:-1g}
    pids_limit: 512

  # Builds every commit the studio makes into /srv/www/current, which Caddy serves. It runs the
  # site's build, so it has a network to itself.
  deploy:
    <<: *hardened
    build:
      context: ../../..
      dockerfile: packages/deploy/Dockerfile
      network: host
    environment:
      DEPLOY_SOURCE: /srv/sites/paraline
      DEPLOY_ROOT: /srv/www
      DEPLOY_BRANCH: ${BRANCH:-main}
      DEPLOY_BUILD: pnpm install --frozen-lockfile && pnpm --filter @greatcms/example-studio-astro... build
      DEPLOY_OUTPUT: examples/studio-astro/dist
      DEPLOY_INTERVAL: "5"
      PUBLIC_CMS_URL: ${SCHEME:-https}://studio.${DOMAIN}
      PUBLIC_CMS_SITE_ID: paraline
    volumes:
      - ${SITES_DIR:-/srv/sites}:/srv/sites:ro
      - www:/srv/www
      # Corepack's downloads and pnpm's store, so a restart fetches nothing again.
      - tool-home:/home/node
      - pnpm-store:/home/node/.pnpm
    tmpfs:
      - /tmp:exec,mode=1777
    networks: [build]
    mem_limit: ${DEPLOY_MEMORY:-2g}
    pids_limit: 2048
    healthcheck:
      test: ["CMD", "node", "bin/greatcms-deploy.mjs", "health"]
      interval: 60s
      timeout: 10s
      start_period: 30s

  # The site's dev server, started on the first request from an editor and stopped after a
  # quiet spell, so it costs nothing while nobody is editing. Same image as the builder. It runs
  # the site's code, so it shares a network with caddy and nothing else.
  preview:
    <<: *hardened
    build:
      context: ../../..
      dockerfile: packages/deploy/Dockerfile
      network: host
    command: ["node", "bin/greatcms-preview.mjs"]
    environment:
      PREVIEW_SOURCE: /srv/sites/paraline
      PREVIEW_COMMAND: pnpm install --frozen-lockfile && pnpm --filter @greatcms/example-studio-astro exec astro dev --host 127.0.0.1 --port $$PORT
      PREVIEW_IDLE: "${PREVIEW_IDLE:-900}"
      # The dev server answers to this name; Vite refuses hosts it was not told about.
      PREVIEW_HOST: preview.${DOMAIN}
      PUBLIC_CMS_URL: ${SCHEME:-https}://studio.${DOMAIN}
      PUBLIC_CMS_SITE_ID: paraline
      ASTRO_TELEMETRY_DISABLED: "1"
    volumes:
      # Read-write: the dev server keeps its caches, and node_modules, inside the working copy.
      - ${SITES_DIR:-/srv/sites}:/srv/sites
      # Corepack's downloads and pnpm's store, so a restart fetches nothing again.
      - tool-home:/home/node
      - pnpm-store:/home/node/.pnpm
    tmpfs:
      - /tmp:exec,mode=1777
    networks: [sites]
    mem_limit: ${PREVIEW_MEMORY:-2g}
    pids_limit: 2048
    healthcheck:
      test: ["CMD", "node", "bin/greatcms-preview.mjs", "health"]
      interval: 30s
      timeout: 5s
      start_period: 10s

networks:
  # Caddy and the studio.
  edge:
  # Caddy and the dev server, which runs the site's own code.
  sites:
  # The builder, which runs the site's build and needs only the registry.
  build:

volumes:
  www:
  studio-data:
  caddy-data:
  caddy-config:
  pnpm-store:
  tool-home:
