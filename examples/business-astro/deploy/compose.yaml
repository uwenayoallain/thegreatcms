# A whole GreatCMS site on one server: the studio editors use, the builder that turns each
# publish into a new release, and Caddy serving the result with HTTPS.
# Builds the two GreatCMS images from this repository.
#
#   cp .env.example .env     # then fill it in
#   COMPOSE_BAKE=false docker compose up -d --build
#
# One DOMAIN in .env gives four addresses, all pointed at this server:
#   DOMAIN            the site (redirects to www)
#   www.DOMAIN        the site
#   studio.DOMAIN     where editors sign in and publish
#   preview.DOMAIN    the site's dev server, open only to a browser signed in to the studio
#
# The site is cloned once into ${SITES_DIR}/kivu-seedworks (default /srv/sites/kivu-seedworks) on the host.

name: kivu-seedworks

x-hosts: &hosts
  SCHEME: ${SCHEME:-https}
  SITE_HOST: ${DOMAIN:?set DOMAIN in .env}
  WWW_HOST: www.${DOMAIN}
  STUDIO_HOST: studio.${DOMAIN}
  PREVIEW_HOST: preview.${DOMAIN}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: *hosts
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - www:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [studio, deploy]

  studio:
    build:
      context: ../../..
      dockerfile: apps/studio/Dockerfile
      network: host
    restart: unless-stopped
    environment:
      STUDIO_PASSWORD: "${STUDIO_PASSWORD:?set STUDIO_PASSWORD in .env}"
      STUDIO_SECRET: "${STUDIO_SECRET:?set STUDIO_SECRET in .env}"
      STUDIO_TRUST_PROXY: "1"
      # Where browsers reach the studio, and the domain its sign-in is shared across, so the
      # preview can ask it whether a visitor is signed in.
      STUDIO_URL: ${SCHEME:-https}://studio.${DOMAIN}
      STUDIO_COOKIE_DOMAIN: ${DOMAIN}
      # The site is registered on first start under a fixed id, which is also its form address.
      STUDIO_SITES: >-
        [{"id":"kivu-seedworks","name":"Kivu Seedworks","path":"/srv/sites/kivu-seedworks/examples/business-astro",
          "devUrl":"${SCHEME:-https}://preview.${DOMAIN}","pushAfterPublish":${PUSH_AFTER_PUBLISH:-false}}]
      GIT_AUTHOR_NAME: ${GIT_NAME:-Studio}
      GIT_AUTHOR_EMAIL: ${GIT_EMAIL:-studio@example.com}
      GIT_COMMITTER_NAME: ${GIT_NAME:-Studio}
      GIT_COMMITTER_EMAIL: ${GIT_EMAIL:-studio@example.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
    volumes:
      - ${SITES_DIR:-/srv/sites}:/srv/sites
      - studio-data:/data
      # Only needed when pushing to GitHub: a deploy key with write access.
      - ${SSH_DIR:-./ssh}:/home/node/.ssh:ro

  # Builds every commit the studio makes into /srv/www/current, which Caddy serves.
  deploy:
    build:
      context: ../../..
      dockerfile: packages/deploy/Dockerfile
      network: host
    restart: unless-stopped
    environment:
      DEPLOY_SOURCE: /srv/sites/kivu-seedworks
      DEPLOY_ROOT: /srv/www
      DEPLOY_BRANCH: ${BRANCH:-main}
      DEPLOY_BUILD: pnpm install --frozen-lockfile && pnpm --filter @greatcms/example-business-astro... build
      DEPLOY_OUTPUT: examples/business-astro/dist
      DEPLOY_INTERVAL: "5"
      PUBLIC_CMS_URL: ${SCHEME:-https}://studio.${DOMAIN}
      PUBLIC_CMS_SITE_ID: kivu-seedworks
    volumes:
      - ${SITES_DIR:-/srv/sites}:/srv/sites:ro
      - www:/srv/www
      - pnpm-store:/home/node/.pnpm

  # The site's dev server, so editors see their change rendered before publishing.
  # The site's dev server, started on the first request from an editor and stopped after a
  # quiet spell, so it costs nothing while nobody is editing. Same image as the builder.
  preview:
    build:
      context: ../../..
      dockerfile: packages/deploy/Dockerfile
    restart: unless-stopped
    command: ["node", "bin/greatcms-preview.mjs"]
    environment:
      PREVIEW_SOURCE: /srv/sites/kivu-seedworks
      PREVIEW_COMMAND: pnpm install --frozen-lockfile && pnpm --filter @greatcms/example-business-astro exec astro dev --host 127.0.0.1 --port $$PORT
      PREVIEW_IDLE: "${PREVIEW_IDLE:-900}"
      # The dev server answers to this name; Vite refuses hosts it was not told about.
      PREVIEW_HOST: preview.${DOMAIN}
      PUBLIC_CMS_URL: ${SCHEME:-https}://studio.${DOMAIN}
      PUBLIC_CMS_SITE_ID: kivu-seedworks
    volumes:
      - ${SITES_DIR:-/srv/sites}:/srv/sites
      - pnpm-store:/home/node/.pnpm

volumes:
  www:
  studio-data:
  caddy-data:
  caddy-config:
  pnpm-store:
