# Conformance fixture site.
#
# Any tool claiming to read the GreatCMS standard must resolve this repo into
# the documents under `expected/`. It deliberately exercises the awkward cases:
# a region with no content file, a region edited before a field was added, a
# blocks region, and a Markdown collection.

version: 1

site:
  name: Conformance Fixture

blocks:
  hero:
    label: Hero
    fields:
      heading: { type: text, required: true, max: 80 }
      image: { type: image }

  text:
    label: Text
    fields:
      body: { type: richtext }

  cta:
    label: Call to action
    variants: [{ value: panel, label: Panel }, { value: inline, label: Inline link }]
    fields:
      label: { type: text, required: true }
      link: { type: link, required: true }
      style: { type: select, options: [primary, secondary], default: primary }

  card:
    label: Card
    fields:
      title: { type: text, required: true }
      body: { type: text }
      tone: { type: select, options: [plain, accent], default: plain }

  # A block whose own field is a list of blocks. Nesting is the point: a
  # conforming reader must apply defaults at every depth, not only the top.
  grid:
    label: Card grid
    fields:
      heading: { type: text, default: What you get }
      cards: { type: blocks, allow: [card], max: 4 }

regions:
  # Fully edited: content file overrides every default.
  home.hero:
    label: Home hero
    fields:
      heading: { type: text, required: true, max: 80 }
      subtitle: { type: text, default: Default subtitle }
      image: { type: image }
      cta: { type: link }
    default:
      heading: Welcome

  # Edited before `badge` existed: proves new schema fields still render.
  home.notice:
    fields:
      message: { type: text, required: true }
      badge: { type: text, default: New }
      dismissible: { type: boolean, default: true }

  # Never edited: proves a site builds before the CMS has touched it.
  about.intro:
    fields:
      heading: { type: text, default: About us }
      body: { type: richtext, default: { html: "<p>We have not written this yet.</p>" } }

  # Block list with nested groups and lists.
  home.body:
    type: blocks
    allow: [hero, text, cta]
    max: 8

  # Decorative image: empty alt is valid here and only here.
  home.decor:
    fields:
      image: { type: image, alt: decorative-allowed }

  # Blocks inside blocks, with a default that has to reach two levels down.
  home.showcase:
    type: blocks
    allow: [grid]

  # Region default over a group: objects merge deeply, so `description` survives.
  home.seo:
    fields:
      seo:
        type: group
        fields:
          title: { type: text, default: Untitled }
          description: { type: text, default: A site managed by GreatCMS }
    default:
      seo: { title: Home }

  # Never edited, and its default blocks still need their own field defaults.
  home.cards:
    fields:
      cards:
        type: blocks
        allow: [card]
        default:
          - { _type: card, title: First card }

  # References store slugs as written; a multiple one nobody filled in is `[]`.
  home.featured:
    fields:
      post: { type: reference, collection: blog }
      guides: { type: reference, collection: guides, multiple: true }

  # Stored over defaults, value by value: an object merges into its default, an array
  # or a null replaces it, a falsy value is still a value, and a key the schema does
  # not know is left where it is.
  home.merge:
    fields:
      cta: { type: link, default: { href: /start, label: Start here } }
      seo:
        type: group
        fields:
          title: { type: text, default: Untitled }
          description: { type: text, default: A site managed by GreatCMS }
      tags:
        { type: select, multiple: true, options: [news, notes, releases], default: [news, notes] }
      note: { type: text, default: Shown until someone clears it }
      count: { type: number, default: 3 }
      shown: { type: boolean, default: true }
      title: { type: text, default: Default title }
    default:
      title: Region title

  # A block list holding a type the schema no longer has, a variant it never had,
  # and a null where a default would otherwise go.
  home.mixed:
    type: blocks
    allow: [cta, card]

  # The file exists and says nothing about blocks: the region is its default.
  home.unset:
    type: blocks
    allow: [card]
    default:
      - { _type: card, title: Default card }

  # Every character a region id may hold. Never edited.
  pricing.faq-2.items_list:
    fields:
      heading: { type: text, default: Questions }

collections:
  # A JSON collection: each entry is one object, with no body and no defaults.
  people:
    path: content/people
    format: json
    fields:
      name: { type: text, required: true }
      role: { type: text, default: Editor }
      links: { type: list, of: { type: link } }

  # Frontmatter and bodies as they turn up in real repositories.
  notes:
    path: content/notes
    body: text
    fields:
      title: { type: text }
      text: { type: richtext }

  # MDX: stored exactly like Markdown, read exactly like Markdown. The
  # difference is the extension, and that an editor must not reformat the body.
  guides:
    label: Guides
    path: content/guides
    format: mdx
    body: content
    slug: title
    fields:
      title: { type: text, required: true, max: 120 }
      date: { type: date, required: true }
      content: { type: richtext }

  blog:
    label: Blog
    path: content/blog
    format: markdown
    body: content
    slug: title
    fields:
      title: { type: text, required: true, max: 120 }
      date: { type: date, required: true }
      tags: { type: list, of: { type: text }, max: 5 }
      related: { type: reference, collection: blog, multiple: true }
      draft: { type: boolean, default: false }
      content: { type: richtext }
