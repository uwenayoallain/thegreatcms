name: Website

# greatcms.uwe.rw: the docs site and every example, published to Cloudflare once CI has passed on
# main. A content edit published from the studio is a commit, so it reaches the website this way too.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and the newest wins.
concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    # Only a push that CI passed: a pull request never reaches this job, so its code never sees the token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the website and the examples
        run: pnpm build && node scripts/build-website.mjs

      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec wrangler deploy

      - name: Say why nothing was published
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Built, not published. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repository's Actions secrets to publish on every push."
