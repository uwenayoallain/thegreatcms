name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm oxlint

      - name: Format check (oxfmt)
        run: pnpm oxfmt --check .

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # The agent-readable docs are generated from SPEC.md and README.md, so a
      # docs change that never regenerates them would quietly ship a stale copy.
      - name: Agent docs are current
        run: pnpm docs:check

      # The browser tests (studio, website, contrast) skip themselves when no browser is present,
      # which is right for a fresh checkout and wrong for CI: a gate that skips
      # is not a gate.
      - name: Install Chromium
        run: pnpm --filter @greatcms/studio exec playwright install --with-deps chromium

      - name: Test (includes the accessibility gate)
        run: pnpm test

      # Every site in this repository is managed by GreatCMS, so the content
      # checker runs against them the way a site would run it in its own build.
      - name: Content matches the schema
        run: |
          (cd apps/docs && node ../../packages/cli/bin/greatcms.mjs check)
          (cd examples/site-astro && node ../../packages/cli/bin/greatcms.mjs check)
          (cd examples/studio-astro && node ../../packages/cli/bin/greatcms.mjs check)
          (cd examples/bakery-next && node ../../packages/cli/bin/greatcms.mjs check)
          (cd examples/changelog-nuxt && node ../../packages/cli/bin/greatcms.mjs check)
          (cd examples/journal-sveltekit && node ../../packages/cli/bin/greatcms.mjs check)
          (cd examples/ceramics-astro && node ../../packages/cli/bin/greatcms.mjs check)

      # Types generated from a schema that has since changed describe a site
      # that does not exist, and nothing else would notice.
      - name: Generated types are current
        run: |
          (cd apps/docs && node ../../packages/cli/bin/greatcms.mjs types --out src/cms.d.ts --check)
          (cd examples/site-astro && node ../../packages/cli/bin/greatcms.mjs types --out src/cms.d.ts --check)
          (cd examples/ceramics-astro && node ../../packages/cli/bin/greatcms.mjs types --out src/cms.d.ts --check)

      # The standard has to be usable outside JavaScript, so CI proves it every
      # run: a Python reader written from SPEC.md must pass the same suite.
      - name: Cross-language conformance
        run: |
          python3 -m pip install --quiet pyyaml
          python3 examples/reader-python/read.py packages/conformance/fixtures "$RUNNER_TEMP/py-out"
          node packages/conformance/bin/greatcms-conformance.mjs verify "$RUNNER_TEMP/py-out"
