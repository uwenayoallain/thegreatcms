# Actions and base images are pinned to exact commits and digests, so something has to move them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /apps/studio
      - /packages/deploy
    schedule:
      interval: weekly
    # Node moves a major by hand: 26 ships without corepack, which both images use to get pnpm.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directories:
      - /apps/studio/tunnel
      - /examples/studio-astro/deploy
    schedule:
      interval: weekly
